name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Nothing ships that has not passed the same gate a pull request passes.
      - name: Verify
        run: ./scripts/verify.sh

      - name: Resolve the version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          NPM=$(node -p "require('./npm/package.json').version")

          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $CRATE but the tag says $VERSION"
            exit 1
          fi
          if [ "$NPM" != "$VERSION" ]; then
            echo "::error::npm/package.json says $NPM but the tag says $VERSION"
            exit 1
          fi

      # Slices the matching CHANGELOG section, the way Winged-Swift's release workflow does.
      - name: Extract the changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "body<<CHANGELOG_EOF"
            sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the WebAssembly package
        run: ./scripts/build-wasm.sh

      - name: Verify the NPM package
        run: ./scripts/verify-npm.sh

      - name: Publish to crates.io
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install

            ```toml
            [dependencies]
            winged-rust = "${{ steps.version.outputs.version }}"
            ```

            ```bash
            npm install winged-rust@${{ steps.version.outputs.version }}
            ```
