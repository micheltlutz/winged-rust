name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # `npm publish --provenance` mints an OIDC token through Sigstore, and GitHub only
  # issues one when the job is allowed to. Without this, the npm step fails after the
  # crate has already gone to crates.io — the worst place to discover it.
  id-token: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Nothing ships that has not passed the same gate a pull request passes.
      - name: Verify
        run: ./scripts/verify.sh

      - name: Resolve the version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          NPM=$(node -p "require('./npm/package.json').version")

          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $CRATE but the tag says $VERSION"
            exit 1
          fi
          if [ "$NPM" != "$VERSION" ]; then
            echo "::error::npm/package.json says $NPM but the tag says $VERSION"
            exit 1
          fi

      # Slices the matching CHANGELOG section. The sed range this replaces terminated on the
      # *next* `## [` heading, so when the section was the last one in the file — which is
      # exactly the shape of a first release — the range ran to EOF and `sed '$d'` ate a
      # real line of the notes. awk stops at the next heading or at EOF, either way whole.
      - name: Extract the changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the WebAssembly package
        run: ./scripts/build-wasm.sh

      - name: Verify the NPM package
        run: ./scripts/verify-npm.sh

      # Both publish steps are idempotent, and that is load-bearing rather than tidy. A
      # release that fails *after* crates.io has accepted the crate cannot be re-run
      # otherwise: the second `cargo publish` errors on a version that is already there,
      # the job dies, and npm and the GitHub Release never get their turn. Publishing is
      # the one thing in this pipeline that cannot be undone, so the steps after it have
      # to remain reachable.
      #
      # The token goes through the environment, not `--token`, which cargo deprecated and
      # which puts the secret in the process argument list.
      - name: Publish to crates.io
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if curl -sfo /dev/null -A "winged-rust release workflow" \
               "https://crates.io/api/v1/crates/winged-rust/$VERSION"; then
            echo "::notice::winged-rust $VERSION is already on crates.io — skipping"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "winged-rust@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::winged-rust $VERSION is already on npm — skipping"
          else
            npm publish --provenance --access public
          fi
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install

            ```toml
            [dependencies]
            winged-rust = "${{ steps.version.outputs.version }}"
            ```

            ```bash
            npm install winged-rust@${{ steps.version.outputs.version }}
            ```
